[project]
name = "crimevision-app"
version = "0.1.0"
description = "Admin desktop application for Crime Vision"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "pyside6>=6.7",
  "peewee>=3.17",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
  "bcrypt>=5.0.0",
  "matplotlib>=3.10.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
crimevision-app = "crimevision.main:main"

